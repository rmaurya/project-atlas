name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the tool reads git history; a shallow clone would hide it
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Runtime packages are in sync
        run: node scripts/sync-runtimes.mjs --check
      # Runs on push as well as on pull_request: the commit that motivated this gate went straight to main,
      # so a check that only saw pull requests would have missed the one case it is named after.
      - name: A runtime change bumps the version
        run: node scripts/check-version-bump.mjs
      - name: Test
        run: node tests/run.mjs
      # No `init` here. This repository commits its own project-atlas.config.json, and init correctly refuses
      # to overwrite one (tests/run.mjs:1495) — so under `bash -e` it aborted the step on every commit from
      # d1c2d15 onward. `--force` would be worse than pointless: it would replace the tuned config with a
      # generated default, and scan/health would then dogfood something this project does not actually ship.
      - name: Dogfood — run the tool on this repository
        run: |
          node scripts/atlas.mjs scan
          node scripts/atlas.mjs health
