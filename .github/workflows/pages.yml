name: Pages
# Publishes the generated site. Runs only when documentation or the generator changes, so it does not
# rebuild on every unrelated commit.
on:
  push:
    branches: [main]
    paths: ['**/*.md', 'scripts/**', 'project-atlas.config.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the tool reads git history; a shallow clone would hide every date
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # --stamp writes build-stamp.txt into the uploaded artifact. Without it the deployed page polls a file
      # that will never exist, gives up after three misses, and only ever changes when someone reloads. With
      # it, an open tab notices the new deploy and patches itself in place — scroll position, sort order and
      # every filter preserved. The page backs its own polling off, so a tab left open is not asking a CDN
      # every three seconds all night.
      - name: Build the site
        run: node scripts/atlas.mjs build --stamp

      # **The one publish path that does not go through `atlas publish`.** `stagePages` strips the panels that
      # describe the machine that built the site — work in flight, the session's task list — and this workflow
      # uploads the built directory straight to Pages instead, so it never saw that strip. On a CI runner the
      # tree is clean and there is no task log, so the panels render empty rather than leaking; the point is
      # that "renders empty" is a property of the runner, not a guarantee of the pipeline. A self-hosted
      # runner, a cached workspace, or a future panel that reads something else would publish it. So the same
      # function runs here, on the same directory, before the upload.
      - name: Strip local-only panels before publishing
        run: |
          node --input-type=module -e "
            import { stripLocalOnlyTree } from './scripts/lib/publish.mjs';
            stripLocalOnlyTree('docs/_wiki');
            console.log('local-only panels stripped from docs/_wiki');
          "

      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/_wiki }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
